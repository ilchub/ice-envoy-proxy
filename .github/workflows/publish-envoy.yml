name: Publish Envoy packages

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-envoy-apt
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, apt-iceinc-solutions]
    timeout-minutes: 45
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and publish signed APT repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ vars.APT_SIGNING_KEY }}
          GNUPGHOME: /var/lib/apt-iceinc-solutions/gnupg
        run: |
          umask 022
          python3 scripts/publish_envoy.py
